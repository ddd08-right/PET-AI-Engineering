<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">Development sampler</title>
<desc id="desc">Cases are sampled uniformly within annotation-coordinate pools and assigned to fixed slots. Slot 1 uses u uniform on zero to one and force foreground when u is below 0.82. Both slots delegate patch selection to upstream nnU-Net get_bbox.</desc>
<defs>
<pattern id="control-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#f4f4f4"/>
<line x1="0" y1="0" x2="0" y2="8" stroke="#69727a" stroke-width="2"/>
</pattern>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#67717b"/>
</marker>
</defs>
<rect x="0" y="0" width="1400" height="620" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#20252b} .title{font-size:26px;font-weight:700} .subtitle{font-size:18px;fill:#4f5963} .section{font-size:22px;font-weight:700} .body{font-size:19px} .small{font-size:17px;fill:#4f5963} .label{font-size:18px;font-weight:700} .metric{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}</style>
<text x="50.0" y="46.0" class="title" text-anchor="start">Development sampler</text>
<text x="50.0" y="76.0" class="subtitle" text-anchor="start">Case selection is separate from upstream patch selection.</text>
<text x="60.0" y="120.0" class="section" text-anchor="start" fill="#3b6f9c">A</text>
<text x="96.0" y="120.0" class="label" text-anchor="start">Case pool</text>
<text x="440.0" y="120.0" class="section" text-anchor="start" fill="#c86f32">B</text>
<text x="476.0" y="120.0" class="label" text-anchor="start">Uniform draw + fixed slot</text>
<text x="1110.0" y="120.0" class="section" text-anchor="start" fill="#377f78">C</text>
<text x="1146.0" y="120.0" class="label" text-anchor="start">Patch selection</text>
<rect x="60.0" y="180.0" width="300.0" height="100.0" fill="#ffffff" stroke="#3b6f9c" stroke-width="1"/>
<text x="210.0" y="222.0" class="label" text-anchor="middle">No class-1 coordinates</text>
<text x="210.0" y="250.0" class="small" text-anchor="middle">annotation-defined pool</text>
<line x1="370.0" y1="230.0" x2="430.0" y2="230.0" stroke="#3b6f9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="440.0" y="180.0" width="220.0" height="100.0" fill="#ffffff" stroke="#3b6f9c" stroke-width="1"/>
<text x="550.0" y="222.0" class="label" text-anchor="middle">Uniform case draw</text>
<text x="550.0" y="250.0" class="small" text-anchor="middle">within pool</text>
<line x1="670.0" y1="230.0" x2="730.0" y2="230.0" stroke="#3b6f9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="740.0" y="180.0" width="310.0" height="100.0" fill="#ffffff" stroke="#3b6f9c" stroke-width="1"/>
<text x="895.0" y="216.0" class="label" text-anchor="middle">slot 0</text>
<text x="895.0" y="248.0" class="small" text-anchor="middle">force_fg = False</text>
<rect x="60.0" y="380.0" width="300.0" height="100.0" fill="#ffffff" stroke="#c86f32" stroke-width="1"/>
<text x="210.0" y="422.0" class="label" text-anchor="middle">Has class-1 coordinates</text>
<text x="210.0" y="450.0" class="small" text-anchor="middle">annotation-defined pool</text>
<line x1="370.0" y1="430.0" x2="430.0" y2="430.0" stroke="#c86f32" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="440.0" y="380.0" width="220.0" height="100.0" fill="#ffffff" stroke="#c86f32" stroke-width="1"/>
<text x="550.0" y="422.0" class="label" text-anchor="middle">Uniform case draw</text>
<text x="550.0" y="450.0" class="small" text-anchor="middle">within pool</text>
<line x1="670.0" y1="430.0" x2="730.0" y2="430.0" stroke="#c86f32" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="740.0" y="380.0" width="310.0" height="100.0" fill="#ffffff" stroke="#c86f32" stroke-width="1"/>
<text x="895.0" y="416.0" class="label" text-anchor="middle">slot 1</text>
<text x="895.0" y="448.0" class="small" text-anchor="middle">u ~ Uniform(0,1); force_fg = (u &lt; 0.82)</text>
<rect x="1120.0" y="270.0" width="230.0" height="120.0" fill="#ffffff" stroke="#377f78" stroke-width="1"/>
<text x="1235.0" y="317.0" class="label" text-anchor="middle">Upstream nnU-Net</text>
<text x="1235.0" y="349.0" class="section" text-anchor="middle">get_bbox</text>
<text x="1235.0" y="375.0" class="small" text-anchor="middle">patch selection</text>
<path d="M1050 230 H1085 V310 H1110" fill="none" stroke="#3b6f9c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1050 430 H1085 V350 H1110" fill="none" stroke="#c86f32" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="50.0" y1="530.0" x2="1350.0" y2="530.0" stroke="#d6dbe0" stroke-width="1"/>
<text x="50.0" y="565.0" class="small" text-anchor="start">Pool membership uses class-1 annotation coordinates; no coordinates does not mean clinical absence.</text>
<text x="50.0" y="592.0" class="small" text-anchor="start">Ignore-label settings can change upstream get_bbox behavior.</text>
</svg>
