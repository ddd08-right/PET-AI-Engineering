<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">Development checkpoint comparison</title>
<desc id="desc">Mean Dice for three non-empty references and volume MAE in millilitres for all five cases. The empty-mask control is analytic, not model inference.</desc>
<defs>
<pattern id="control-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#f4f4f4"/>
<line x1="0" y1="0" x2="0" y2="8" stroke="#69727a" stroke-width="2"/>
</pattern>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#67717b"/>
</marker>
</defs>
<rect x="0" y="0" width="1400" height="620" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#20252b} .title{font-size:26px;font-weight:700} .subtitle{font-size:18px;fill:#4f5963} .section{font-size:22px;font-weight:700} .body{font-size:19px} .small{font-size:17px;fill:#4f5963} .label{font-size:18px;font-weight:700} .metric{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}</style>
<text x="50.0" y="46.0" class="title" text-anchor="start">Development checkpoint comparison</text>
<text x="50.0" y="76.0" class="subtitle" text-anchor="start">Five-case, single-seed/fold post-hoc development analysis</text>
<rect x="50.0" y="105.0" width="630.0" height="430.0" fill="#ffffff" stroke="#aeb7c0" stroke-width="1"/>
<text x="72.0" y="142.0" class="section" text-anchor="start" fill="#3b6f9c">A</text>
<text x="108.0" y="142.0" class="label" text-anchor="start">Mean Dice, non-empty references</text>
<text x="108.0" y="171.0" class="small" text-anchor="start">n=3</text>
<line x1="285.0" y1="198.0" x2="285.0" y2="458.0" stroke="#d6dbe0" stroke-width="1"/>
<text x="285.0" y="488.0" class="small" text-anchor="middle">0.0</text>
<line x1="351.0" y1="198.0" x2="351.0" y2="458.0" stroke="#d6dbe0" stroke-width="1"/>
<text x="351.0" y="488.0" class="small" text-anchor="middle">0.2</text>
<line x1="417.0" y1="198.0" x2="417.0" y2="458.0" stroke="#d6dbe0" stroke-width="1"/>
<text x="417.0" y="488.0" class="small" text-anchor="middle">0.4</text>
<line x1="483.0" y1="198.0" x2="483.0" y2="458.0" stroke="#d6dbe0" stroke-width="1"/>
<text x="483.0" y="488.0" class="small" text-anchor="middle">0.6</text>
<line x1="549.0" y1="198.0" x2="549.0" y2="458.0" stroke="#d6dbe0" stroke-width="1"/>
<text x="549.0" y="488.0" class="small" text-anchor="middle">0.8</text>
<line x1="615.0" y1="198.0" x2="615.0" y2="458.0" stroke="#d6dbe0" stroke-width="1"/>
<text x="615.0" y="488.0" class="small" text-anchor="middle">1.0</text>
<text x="72.0" y="244.0" class="small" text-anchor="start">Final</text>
<rect x="285.0" y="218.0" width="32.7" height="34" fill="#3b6f9c"/>
<text x="329.7" y="243.0" class="metric" text-anchor="start">0.0991</text>
<text x="72.0" y="336.0" class="small" text-anchor="start">EMA-selected checkpoint</text>
<rect x="285.0" y="310.0" width="72.2" height="34" fill="#c86f32"/>
<text x="369.2" y="335.0" class="metric" text-anchor="start">0.2187</text>
<text x="72.0" y="417.0" class="small" text-anchor="start">Empty-mask control</text>
<text x="72.0" y="439.0" class="small" text-anchor="start">(analytic)</text>
<rect x="285.0" y="402.0" width="0.0" height="34" fill="url(#control-hatch)" stroke="#69727a" stroke-width="1.5"/>
<text x="297.0" y="427.0" class="metric" text-anchor="start">0.0000</text>
<line x1="285.0" y1="458.0" x2="615.0" y2="458.0" stroke="#67717b" stroke-width="1"/>
<rect x="720.0" y="105.0" width="630.0" height="430.0" fill="#ffffff" stroke="#aeb7c0" stroke-width="1"/>
<text x="742.0" y="142.0" class="section" text-anchor="start" fill="#c86f32">B</text>
<text x="778.0" y="142.0" class="label" text-anchor="start">Volume MAE (mL)</text>
<text x="778.0" y="171.0" class="small" text-anchor="start">all cases, n=5</text>
<line x1="955.0" y1="198.0" x2="955.0" y2="458.0" stroke="#d6dbe0" stroke-width="1"/>
<text x="955.0" y="488.0" class="small" text-anchor="middle">0</text>
<line x1="1037.5" y1="198.0" x2="1037.5" y2="458.0" stroke="#d6dbe0" stroke-width="1"/>
<text x="1037.5" y="488.0" class="small" text-anchor="middle">20</text>
<line x1="1120.0" y1="198.0" x2="1120.0" y2="458.0" stroke="#d6dbe0" stroke-width="1"/>
<text x="1120.0" y="488.0" class="small" text-anchor="middle">40</text>
<line x1="1202.5" y1="198.0" x2="1202.5" y2="458.0" stroke="#d6dbe0" stroke-width="1"/>
<text x="1202.5" y="488.0" class="small" text-anchor="middle">60</text>
<line x1="1285.0" y1="198.0" x2="1285.0" y2="458.0" stroke="#d6dbe0" stroke-width="1"/>
<text x="1285.0" y="488.0" class="small" text-anchor="middle">80</text>
<text x="742.0" y="244.0" class="small" text-anchor="start">Final</text>
<rect x="955.0" y="218.0" width="245.2" height="34" fill="#3b6f9c"/>
<text x="1212.2" y="243.0" class="metric" text-anchor="start">59.43 mL</text>
<text x="742.0" y="336.0" class="small" text-anchor="start">EMA-selected checkpoint</text>
<rect x="955.0" y="310.0" width="260.7" height="34" fill="#c86f32"/>
<text x="1227.7" y="335.0" class="metric" text-anchor="start">63.21 mL</text>
<text x="742.0" y="417.0" class="small" text-anchor="start">Empty-mask control</text>
<text x="742.0" y="439.0" class="small" text-anchor="start">(analytic)</text>
<rect x="955.0" y="402.0" width="137.4" height="34" fill="url(#control-hatch)" stroke="#69727a" stroke-width="1.5"/>
<text x="1104.4" y="427.0" class="metric" text-anchor="start">33.30 mL</text>
<line x1="955.0" y1="458.0" x2="1285.0" y2="458.0" stroke="#67717b" stroke-width="1"/>
<text x="50.0" y="580.0" class="small" text-anchor="start">Values: frozen public aggregates; bars start at zero. No uncertainty intervals are available.</text>
</svg>
