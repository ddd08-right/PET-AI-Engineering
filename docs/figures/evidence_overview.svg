<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
<title id="title">Three evidence tracks</title>
<desc id="desc">Separate PyTorch training demonstration, nnU-Net development analysis, and risk-coverage utility tracks; not a completed patient-level pipeline.</desc>
<defs>
<pattern id="control-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="8" height="8" fill="#f4f4f4"/>
<line x1="0" y1="0" x2="0" y2="8" stroke="#69727a" stroke-width="2"/>
</pattern>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#67717b"/>
</marker>
</defs>
<rect x="0" y="0" width="1400" height="600" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#20252b} .title{font-size:26px;font-weight:700} .subtitle{font-size:18px;fill:#4f5963} .section{font-size:22px;font-weight:700} .body{font-size:19px} .small{font-size:17px;fill:#4f5963} .label{font-size:18px;font-weight:700} .metric{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}</style>
<text x="50.0" y="46.0" class="title" text-anchor="start">Three evidence tracks</text>
<text x="50.0" y="76.0" class="subtitle" text-anchor="start">Inputs → computation → outputs; tracks are evaluated separately.</text>
<rect x="50.0" y="110.0" width="390.0" height="400.0" fill="#ffffff" stroke="#aeb7c0" stroke-width="1"/>
<text x="72.0" y="148.0" class="section" text-anchor="start" fill="#3b6f9c">A</text>
<text x="108.0" y="148.0" class="label" text-anchor="start">PyTorch training demonstration</text>
<rect x="485.0" y="110.0" width="390.0" height="400.0" fill="#ffffff" stroke="#aeb7c0" stroke-width="1"/>
<text x="507.0" y="148.0" class="section" text-anchor="start" fill="#c86f32">B</text>
<text x="543.0" y="148.0" class="label" text-anchor="start">nnU-Net development analysis</text>
<rect x="920.0" y="110.0" width="390.0" height="400.0" fill="#ffffff" stroke="#aeb7c0" stroke-width="1"/>
<text x="942.0" y="148.0" class="section" text-anchor="start" fill="#377f78">C</text>
<text x="978.0" y="148.0" class="label" text-anchor="start">Risk–coverage utilities</text>
<rect x="68.0" y="220.0" width="104.0" height="92.0" fill="#ffffff" stroke="#3b6f9c" stroke-width="1"/>
<text x="120.0" y="259.0" class="label" text-anchor="middle">Synthetic</text>
<text x="120.0" y="285.0" class="small" text-anchor="middle">PET/CT input</text>
<line x1="176.0" y1="266.0" x2="187.0" y2="266.0" stroke="#3b6f9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="193.0" y="220.0" width="104.0" height="92.0" fill="#ffffff" stroke="#3b6f9c" stroke-width="1"/>
<text x="245.0" y="259.0" class="label" text-anchor="middle">Forward</text>
<text x="245.0" y="285.0" class="small" text-anchor="middle">loss</text>
<line x1="301.0" y1="266.0" x2="312.0" y2="266.0" stroke="#3b6f9c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="318.0" y="220.0" width="104.0" height="92.0" fill="#ffffff" stroke="#3b6f9c" stroke-width="1"/>
<text x="370.0" y="259.0" class="label" text-anchor="middle">Backward</text>
<text x="370.0" y="285.0" class="small" text-anchor="middle">update</text>
<text x="70.0" y="355.0" class="label" text-anchor="start">Synthetic tests</text>
<text x="70.0" y="385.0" class="small" text-anchor="start">Output: logits, loss, gradients, update</text>
<rect x="503.0" y="220.0" width="104.0" height="92.0" fill="#ffffff" stroke="#c86f32" stroke-width="1"/>
<text x="555.0" y="259.0" class="label" text-anchor="middle">PET + CT</text>
<text x="555.0" y="285.0" class="small" text-anchor="middle">5 cases</text>
<line x1="611.0" y1="266.0" x2="622.0" y2="266.0" stroke="#c86f32" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="628.0" y="220.0" width="104.0" height="92.0" fill="#ffffff" stroke="#c86f32" stroke-width="1"/>
<text x="680.0" y="259.0" class="label" text-anchor="middle">Upstream</text>
<text x="680.0" y="285.0" class="small" text-anchor="middle">nnU-Net</text>
<line x1="736.0" y1="266.0" x2="747.0" y2="266.0" stroke="#c86f32" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="753.0" y="220.0" width="104.0" height="92.0" fill="#ffffff" stroke="#c86f32" stroke-width="1"/>
<text x="805.0" y="259.0" class="label" text-anchor="middle">Metrics</text>
<text x="805.0" y="285.0" class="small" text-anchor="middle">Final / EMA</text>
<text x="505.0" y="355.0" class="label" text-anchor="start">Single seed / fold 0</text>
<text x="505.0" y="385.0" class="small" text-anchor="start">Public sampler adaptation; PARTIAL_RECIPE</text>
<text x="505.0" y="414.0" class="small" text-anchor="start">Development analysis; not an independent test</text>
<rect x="938.0" y="220.0" width="104.0" height="92.0" fill="#ffffff" stroke="#377f78" stroke-width="1"/>
<text x="990.0" y="259.0" class="label" text-anchor="middle">Synthetic</text>
<text x="990.0" y="285.0" class="small" text-anchor="middle">errors, scores</text>
<line x1="1046.0" y1="266.0" x2="1057.0" y2="266.0" stroke="#377f78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1063.0" y="220.0" width="104.0" height="92.0" fill="#ffffff" stroke="#377f78" stroke-width="1"/>
<text x="1115.0" y="259.0" class="label" text-anchor="middle">Risk rank</text>
<text x="1115.0" y="285.0" class="small" text-anchor="middle">expected ties</text>
<line x1="1171.0" y1="266.0" x2="1182.0" y2="266.0" stroke="#377f78" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1188.0" y="220.0" width="104.0" height="92.0" fill="#ffffff" stroke="#377f78" stroke-width="1"/>
<text x="1240.0" y="259.0" class="label" text-anchor="middle">Output</text>
<text x="1240.0" y="285.0" class="small" text-anchor="middle">risk–coverage</text>
<text x="940.0" y="355.0" class="label" text-anchor="start">Synthetic tests</text>
<text x="940.0" y="385.0" class="small" text-anchor="start">Real-patient reliability study incomplete</text>
<line x1="50.0" y1="550.0" x2="1350.0" y2="550.0" stroke="#d6dbe0" stroke-width="1"/>
<text x="50.0" y="580.0" class="small" text-anchor="start">Shared QC and provenance do not make these tracks one end-to-end patient study.</text>
</svg>
